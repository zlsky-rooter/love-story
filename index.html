<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我们的恋爱纪念册</title>
  <meta name="description" content="记录我们在一起的每一天">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💕</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 爱心飘落 -->
  <div id="hearts-container" class="hearts-container"></div>

  <!-- 导航栏 -->
  <nav class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="nav-brand">
        <span class="heart">💕</span> Love Story
      </a>
      <button class="nav-toggle" aria-label="菜单">☰</button>
      <ul class="nav-links">
        <li><a href="index.html" class="active">🏠 首页</a></li>
        <li><a href="story.html">📖 我们的故事</a></li>
        <li><a href="gallery.html">📸 照片墙</a></li>
        <li><a href="notes.html">💌 恋爱笔记</a></li>
        <li>
          <button class="theme-btn" aria-label="切换主题">
            <span class="theme-icon">🌙</span>
          </button>
        </li>
      </ul>
    </div>
  </nav>

  <!-- Hero 区域 -->
  <section class="hero">
    <div class="hero-content container">
      <div class="hero-icon">💕</div>
      <h1>我们的恋爱纪念册</h1>
      <p class="hero-subtitle">记录和你在一起的每一个美好瞬间</p>

      <!-- 倒计时 -->
      <div id="countdown" class="countdown">
        <div class="countdown-item">
          <div class="countdown-number" id="count-days">00</div>
          <div class="countdown-label">天</div>
        </div>
        <div class="countdown-item">
          <div class="countdown-number" id="count-hours">00</div>
          <div class="countdown-label">时</div>
        </div>
        <div class="countdown-item">
          <div class="countdown-number" id="count-mins">00</div>
          <div class="countdown-label">分</div>
        </div>
        <div class="countdown-item">
          <div class="countdown-number" id="count-secs">00</div>
          <div class="countdown-label">秒</div>
        </div>
      </div>

      <p class="love-days">
        我们已经在一起 <strong id="days-count">0</strong> 天啦 💖
      </p>

      <div style="margin-top: 36px; display: flex; gap: 16px; justify-content: center; flex-wrap: wrap;">
        <a href="story.html" class="btn btn-primary">📖 看我们的故事</a>
        <a href="gallery.html" class="btn btn-outline">📸 翻翻照片墙</a>
      </div>
    </div>
  </section>

  <!-- 页脚 -->
  <footer class="footer">
    <p>Made with <span class="heart">💕</span> for the one I love</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
