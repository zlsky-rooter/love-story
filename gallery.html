  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="hearts-container" class="hearts-container"></div>

  <nav class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="nav-brand">
        <span class="heart">💕</span> Love Story
      </a>
      <button class="nav-toggle" aria-label="菜单">☰</button>
      <ul class="nav-links">
        <li><a href="index.html">🏠 首页</a></li>
        <li><a href="story.html">📖 我们的故事</a></li>
        <li><a href="gallery.html" class="active">📸 照片墙</a></li>
        <li><a href="notes.html">💌 恋爱笔记</a></li>
        <li>
          <button class="theme-btn" aria-label="切换主题">
            <span class="theme-icon">🌙</span>
          </button>
        </li>
      </ul>
    </div>
  </nav>

  <section class="page-header">
    <h1>📸 照片墙</h1>
    <p>每一张照片，都是我们相爱的证据</p>
  </section>

  <!-- 分类筛选按钮 -->
  <div class="gallery-filter container">
    <button class="filter-btn active" data-filter="all">✨ 全部</button>
    <button class="filter-btn" data-filter="date">💕 约会</button>
    <button class="filter-btn" data-filter="travel">✈️ 旅行</button>
    <button class="filter-btn" data-filter="daily">🌸 日常</button>
    <button class="filter-btn" data-filter="special">🎉 特别日子</button>
  </div>

  <!--
    🔧 使用说明：
    把照片放到 images/ 文件夹，然后在这里添加。
    每张照片用 <div class="gallery-item" data-category="分类"> 包裹。
    分类可选：date / travel / daily / special
  -->
  <div class="gallery-grid container">

    <!-- 模板：复制这个块来添加新照片 -->
    <div class="gallery-item" data-category="daily">
      <img src="images/photo_1785647369130_IMG_0356.JPG" alt="你最喜欢的大海" loading="lazy">
      <div class="gallery-caption">📸 你最喜欢的大海</div>
    </div>

    <div class="gallery-item" data-category="date">
      <img src="images/photo_1785647329046_16535.JPG" alt="你与闺蜜" loading="lazy">
      <div class="gallery-caption">📸 你与闺蜜</div>
    </div>

    <div class="gallery-item" data-category="date">
      <img src="images/photo_1785647266676_455b84228cb5469f4431adac8cf33c1b.JPG" alt="your古装" loading="lazy">
      <div class="gallery-caption">📸 your古装</div>
    </div>

    <div class="gallery-item" data-category="date">
      <img src="images/photo_1785647235086_9af85247551b6cae08d2ec9aa9f9eacc.JPG" alt="your古装" loading="lazy">
      <div class="gallery-caption">📸 your古装</div>
    </div>

    <!--
    <div class="gallery-item" data-category="date">
      <img src="images/photo1.jpg" alt="照片描述" loading="lazy">
      <div class="gallery-caption">📸 照片描述文字</div>
    </div>
    -->

    <!-- 占位示例 - 替换为你们的真实照片 -->
    
        <div style="font-size: 1rem; margin-top: 8px;">把你们的合照<br>放到 images 文件夹</div>
      </div>
      <div class="gallery-caption">等待你们的甜蜜照片 🥰</div>
    </div>

    
        <div style="font-size: 1rem; margin-top: 8px;">旅行照片<br>放在这里</div>
      </div>
      <div class="gallery-caption">一起去看世界 🌍</div>
    </div>

    
        <div style="font-size: 1rem; margin-top: 8px;">生日/纪念日<br>照片放这里</div>
      </div>
      <div class="gallery-caption">每一个特别的日子 🎉</div>
    </div>

  </div>

  <!-- 灯箱 -->
  <div id="lightbox" class="lightbox">
    <button class="lightbox-close">&times;</button>
    <img src="" alt="">
  </div>

  <footer class="footer">
    <p>Made with <span class="heart">💕</span> for the one I love</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
